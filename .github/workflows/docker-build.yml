name: docker-build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests (no network)
        run: |
          python3 -m pip install --quiet -r requirements.txt
          python3 tests/test_smoke.py

      - id: meta
        name: Derive version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      # Build only. A broken image must never reach the registry, so the push
      # happens after the smoke test below.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: minimax-code2api:ci
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 18080:8080 minimax-code2api:ci
          cleanup() { docker logs smoke || true; docker rm -f smoke || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:18080/ ; then break; fi
            sleep 1
          done
          echo "--- routing table ---"
          curl -fsS http://127.0.0.1:18080/ | tee /tmp/root.json
          python3 - <<'PY'
          import json
          data = json.load(open("/tmp/root.json"))
          assert data["name"] == "minimax-code2api", data
          assert "POST /v1/chat/completions" in data["endpoints"], data
          assert data["models"], data
          print("catalogue ok:", len(data["models"]), "models")
          PY

          echo "--- /v1/models ---"
          curl -fsS http://127.0.0.1:18080/v1/models | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['object']=='list' and d['data']; print('models ok:', [m['id'] for m in d['data']])"

          # Without credentials the gateway must stay up and report degraded,
          # never crash-loop. This is the container's documented behaviour.
          echo "--- /healthz without credential ---"
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://127.0.0.1:18080/healthz)
          echo "status=$code body=$(cat /tmp/health.json)"
          test "$code" = "503"

          # Auth branch: with GATEWAY_API_KEY unset everything is open, so the
          # guard itself is covered by the unit tests; here we only assert that a
          # bad body is rejected rather than sent upstream.
          echo "--- invalid body rejected ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/v1/chat/completions \
            -H 'content-type: application/json' -d '{"messages":[]}')
          echo "status=$code"
          test "$code" = "400"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          REPO="ghcr.io/${IMAGE_NAME,,}"
          docker tag minimax-code2api:ci "${REPO}:latest"
          docker push "${REPO}:latest"

          docker tag minimax-code2api:ci "${REPO}:${GITHUB_REF_NAME}"
          docker push "${REPO}:${GITHUB_REF_NAME}"

          docker tag minimax-code2api:ci "${REPO}:${{ steps.meta.outputs.version }}"
          docker push "${REPO}:${{ steps.meta.outputs.version }}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            SEMVER="${GITHUB_REF#refs/tags/}"
            MAJOR_MINOR="${SEMVER%.*}"
            docker tag minimax-code2api:ci "${REPO}:${MAJOR_MINOR}"
            docker push "${REPO}:${MAJOR_MINOR}"
            docker tag minimax-code2api:ci "${REPO}:${MAJOR_MINOR%%.*}"
            docker push "${REPO}:${MAJOR_MINOR%%.*}"
          fi

          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${REPO}:latest\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${REPO}:${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${REPO}:${{ steps.meta.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Save offline image artifact
        if: github.event_name != 'pull_request'
        run: |
          docker save minimax-code2api:ci | gzip -9 > minimax-code2api.tar.gz
          ls -lh minimax-code2api.tar.gz

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: minimax-code2api-${{ steps.meta.outputs.version }}
          path: minimax-code2api.tar.gz
          retention-days: 7
